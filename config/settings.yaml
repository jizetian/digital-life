# Local-first defaults. Override the database path with CHATTWIN_DB_PATH.
database:
  path: data/database/cleaned_messages.db

import:
  batch_size: 1000
  raw_dir: data/raw/moect_export

segmentation:
  gap_minutes: 30
  max_messages: 50
  overlap_messages: 4
  overlap_on_time_gap: false
  page_size: 2000

distillation:
  batch_size: 8
  base_url: http://127.0.0.1:11434/v1
  model: qwen2.5:7b
  model_version: ""
  timeout_seconds: 120
  temperature: 0
  max_attempts: 3
  max_chars_per_message: 4000

# Long-term memory. The model URL and name come from distillation above.
# memories_fts is the memory table's own lexical index. Hybrid search uses retrieval_fts.
memory:
  batch_size: 4
  max_attempts: 3
  max_chars_per_message: 2000
  max_existing: 40

# L2/L3 personality. The model URL and name come from distillation above.
personality:
  batch_size: 20
  contradict_batch_size: 30
  max_attempts: 3
  min_independent: 2
  max_chars_per_summary: 500
  output_dir: personality

# Hybrid retrieval. BGE-M3 is served by the OpenAI-compatible embeddings endpoint.
# The chat model above is not the embedding model. Qdrant files stay under data/qdrant.
retrieval:
  embedding_provider: openai
  embedding_model: bge-m3
  embedding_base_url: ""
  embedding_dimension: 1024
  embedding_batch_size: 16
  embedding_timeout_seconds: 120
  qdrant_path: data/qdrant
  qdrant_url: ""
  vector_backend: qdrant
  rerank_url: ""
  rrf_k: 60
  default_limit: 10
  candidate_limit: 40
  max_chars: 8000

# Digital-twin chat. The model URL and name come from distillation above.
# Sessions are rows in the same SQLite file. They are not committed.
chat:
  target_name: 不吃香菜
  max_chars: 6000
  personality_chars: 1400
  history_turns: 8
  history_chars: 1600
  user_chars: 2000
  retrieval_limit: 8
  temperature: 0.4
